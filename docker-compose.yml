services:
  server:
    build: ./server
    environment:
      # Optional: without a key the game uses clear weather
      WeatherKey: ${WEATHER_KEY:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"

  client:
    build:
      context: ./client
      args:
        # The browser calls the server directly, so this must be reachable from the host
        REACT_APP_API_URL: http://localhost:${SERVER_PORT:-8080}
    ports:
      - "${CLIENT_PORT:-3000}:80"
    depends_on:
      - server
